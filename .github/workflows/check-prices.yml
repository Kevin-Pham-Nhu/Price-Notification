name: Check prices

on:
  schedule:
    # Twice a day, inside the hours Unieuro's robots.txt asks automated visitors to use (04:00-08:45 UTC).
    - cron: '20 4 * * *'
    - cron: '20 8 * * *'
  push:
    paths:
      - docs/data/products.json
  workflow_dispatch:
    inputs:
      test_telegram:
        description: Only send a Telegram test message
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send Telegram test message
        if: ${{ inputs.test_telegram }}
        run: node scripts/check.mjs --test-telegram

      - name: Check prices
        if: ${{ !inputs.test_telegram }}
        run: node scripts/check.mjs

      - name: Save price history
        if: ${{ !inputs.test_telegram }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update price history"
          git pull --rebase
          git push
